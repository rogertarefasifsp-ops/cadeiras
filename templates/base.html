<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Assento Usado{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top"><a href="{{ url_for('index') }}" class="logo">Assento Usado</a>
<span>Cadeiras de segunda mão, direto com o vendedor</span></header>
<main>{% block content %}{% endblock %}</main>
<footer>© Assento Usado. Combine pagamento e retirada direto com o vendedor.</footer>
</body>
</html>
